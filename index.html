<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiscalVis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="favicon/logo.jpg" type="image/jpeg">
</head>
<body class="bg-zinc-950 min-h-screen text-zinc-100 font-sans">
    <div class="container mx-auto px-4 py-12 max-w-7xl">
        <!-- Header -->
        <header class="text-center mb-16">
            <img src="favicon/logo.jpg" alt="FiscalVis" class="h-16 md:h-20 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(13,148,136,0.4)]">
            <p class="text-zinc-400 text-xl tracking-wide">Conscientização Patrimonial em Tempo Real</p>
        </header>

        <!-- Contador Dinâmico -->
        <section class="bg-zinc-900/80 backdrop-blur-xl rounded-3xl p-12 mb-12 border border-zinc-800 shadow-2xl">
            <div class="text-center">
                <p class="text-zinc-400 text-sm uppercase tracking-[0.3em] mb-6 font-medium">Arrecadação Acumulada</p>
                
                <!-- Container Principal dos Grupos de Dígitos -->
                <div id="painel-digitos" class="flex flex-row justify-center items-start gap-4 mb-6">
                    <!-- Sub-containers serão gerados dinamicamente via JavaScript -->
                </div>
                
                <p class="text-zinc-500 text-sm mt-6 tracking-wide">
                    <span id="nome-setor-exibido">Geral</span> • Impostômetro em Tempo Real • Base 2026
                </p>
            </div>
        </section>

        <!-- Seção de Input/Filtro -->
        <section class="bg-zinc-900/60 backdrop-blur-xl rounded-2xl p-8 mb-12 border border-zinc-800">
            <div class="flex flex-col lg:flex-row items-center gap-6">
                <div class="flex-1 w-full">
                    <label for="valor-custom" class="block text-zinc-400 text-sm mb-3 font-medium">
                        <i class="fa-solid fa-sliders mr-2 text-teal-500"></i>Simular Valor Customizado
                    </label>
                    <div class="flex gap-3">
                        <input 
                            type="text" 
                            id="valor-custom" 
                            placeholder="Digite um valor (ex: 1000000)"
                            class="flex-1 bg-zinc-800/50 border border-zinc-700 rounded-xl px-5 py-4 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500/50 transition-all"
                        >
                        <button 
                            id="btn-aplicar" 
                            class="bg-teal-600 hover:bg-teal-500 text-zinc-950 font-bold px-8 py-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-teal-600/20"
                        >
                            Aplicar
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button 
                        id="btn-pausar" 
                        class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-zinc-100 font-semibold px-6 py-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 border border-zinc-700"
                    >
                        <i class="fa-solid fa-pause mr-2"></i>Pausar
                    </button>
                    <button 
                        id="btn-retomar" 
                        class="bg-teal-600 hover:bg-teal-500 text-zinc-950 font-semibold px-6 py-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 hidden shadow-lg shadow-teal-600/20"
                    >
                        <i class="fa-solid fa-play mr-2"></i>Retomar
                    </button>
                </div>
            </div>
        </section>

        <!-- Barra de Setores -->
        <section class="mb-12">
            <div class="flex flex-wrap gap-4 justify-center">
                <!-- Geral -->
                <div class="flex flex-col items-center">
                    <button 
                        data-setor="geral" 
                        class="setor-btn active bg-teal-600 text-zinc-950 px-6 py-3 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-teal-600/30"
                    >
                        <i class="fa-solid fa-globe mr-2"></i>Geral
                    </button>
                    <p class="text-zinc-600 text-xs mt-2 text-center max-w-[150px]">Arrecadação Nacional Total</p>
                </div>
                
                <!-- Exatas -->
                <div class="flex flex-col items-center">
                    <button 
                        data-setor="exatas" 
                        class="setor-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                    >
                        <i class="fa-solid fa-calculator mr-2"></i>Exatas
                    </button>
                    <p class="text-zinc-600 text-xs mt-2 text-center max-w-[150px]">T.I., Bancos, Energia, Indústria...</p>
                </div>
                
                <!-- Humanas -->
                <div class="flex flex-col items-center">
                    <button 
                        data-setor="humanas" 
                        class="setor-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                    >
                        <i class="fa-solid fa-users mr-2"></i>Humanas
                    </button>
                    <p class="text-zinc-600 text-xs mt-2 text-center max-w-[150px]">Comércio, Advocacia, Admin...</p>
                </div>
                
                <!-- Biológicas -->
                <div class="flex flex-col items-center">
                    <button 
                        data-setor="biologicas" 
                        class="setor-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                    >
                        <i class="fa-solid fa-heart-pulse mr-2"></i>Biológicas
                    </button>
                    <p class="text-zinc-600 text-xs mt-2 text-center max-w-[150px]">Saúde, Farmacêutica, Agro...</p>
                </div>
            </div>
        </section>

        <!-- Barra de Filtros -->
        <section class="mb-12">
            <div class="flex flex-wrap gap-3 justify-center">
                <button 
                    data-filtro="todos" 
                    class="filtro-btn active bg-teal-600 text-zinc-950 px-6 py-3 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-teal-600/30"
                >
                    <i class="fa-solid fa-layer-group mr-2"></i>Todos
                </button>
                <button 
                    data-filtro="imoveis_terrenos" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-building mr-2"></i>Imóveis
                </button>
                <button 
                    data-filtro="veiculos_terrestres" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-car mr-2"></i>Terrestres
                </button>
                <button 
                    data-filtro="veiculos_aquaticos" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-ship mr-2"></i>Aquáticos
                </button>
                <button 
                    data-filtro="veiculos_aereos" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-plane mr-2"></i>Aéreos
                </button>
                <button 
                    data-filtro="infraestrutura" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-road mr-2"></i>Infraestrutura
                </button>
                <button 
                    data-filtro="complexos_industriais" 
                    class="filtro-btn bg-transparent border border-zinc-800 text-zinc-400 hover:text-zinc-100 hover:border-zinc-600 px-6 py-3 rounded-full font-medium transition-all transform hover:scale-105 active:scale-95"
                >
                    <i class="fa-solid fa-industry mr-2"></i>Complexos Industriais
                </button>
            </div>
        </section>

        <!-- Grid de Resultados -->
        <section id="grid-bens" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards serão renderizados via JavaScript -->
        </section>

        <!-- Estado Vazio -->
        <div id="estado-vazio" class="hidden text-center py-20">
            <i class="fa-solid fa-box-open text-7xl text-zinc-700 mb-6"></i>
            <p class="text-zinc-500 text-xl font-medium">Nenhum bem encontrado para este filtro</p>
        </div>
    </div>
<!---->
    <script src="javascript/script.js"></script>
</body>
</html>
